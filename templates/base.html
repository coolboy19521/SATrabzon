<!doctype html>
<html>
    <head>
        <title>SATrabzon</title>
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            html,body{
                overflow: hidden;
            }
            @media (max-width: 1000px) {
                html,body{
                    overflow: visible;
                }
            }
            *{
                font-family: Calibri;
                font-size: 18px;
            }
            @media (max-width: 500px) {
                *{
                    font-size: 14px;
                }
            }
            button{
                background-color:white;
                border:1px solid black;
                border-radius: 10px;
                cursor:pointer;
            }
            .opener{
                float:right;
                margin-left:13px;
            }
            .package{
                margin:16px 5px 16px 0;
            }
            .panel{
                display: none;
                overflow: hidden;
            }
            fieldset{
                height:97vh;
                display:inline-block;
                overflow-y: auto;
                overflow-x: hidden;
                box-sizing: border-box;
            }
            @media (max-width: 1000px) {
                fieldset{
                    height: auto;
                }
            }

            hr{
                margin:20px 0;
            }

            #generate-row {
                width: auto;
                margin:auto;
            }

            #generate-row input {
                width: calc(100% - 100px);
                box-sizing: border-box;
            }

            input:focus{
                outline: none;
            }

            #generate-row button {
                width: 90px;
                float: right;
            }

            #start{
                margin-top:15px;
                width:100%;
            }

            #container {
                display: flex;
                height: 100%;
            }

            #container>fieldset{
                flex-shrink: 0;
            }

            @media (max-width: 1000px) {
                #container {
                    flex-direction: column-reverse;
                }
            }

            #content {
                flex-grow: 1;
                overflow-y: auto;
            }
            a{
                text-decoration:none;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <fieldset>
                <legend>Select sets</legend>
                {% for package in packages %}
                    <div class="package">
                        <div>
                            <input type="checkbox" class="meta" id="{{ package[0] }}" />
                            <label for="{{ package[0] }}">
                                {% set name = package[0].split('-') %}
                                {% for word in name %}
                                    {{ word|capitalize }}
                                {% endfor %}
                            </label>
                            <button id="{{ package[0] }}" class="opener">Show sets</button>
                        </div>
                        
                        <div class="panel" id="panel-{{ package[0] }}">
                            {% for i in range(package[1]|int) %}
                                <div>
                                    &nbsp;&nbsp;&nbsp;&nbsp;<input type="checkbox" id="{{ package[0] }}-{{ i }}" name="sets" value="{{ package[0] }}-{{ i }}" onchange="change(this)" />
                                    <label for="{{ package[0] }}-{{ i }}">
                                        Set {{ i + 1 }}
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                {% endfor %}
                <a href="/">SATrabzon©, Since 28.02.2026, Vocabulary Preparation</a>
                <hr>
                <div id="generate-row">
                    <input id="pin-box" spellcheck="false">
                    <button id="generate" onclick="generate()">Generate</button>
                </div>
                <div>
                    <button id="start" onclick="start()">Start</button>
                </div>
            </fieldset>
            <div id="content">
                {% block content %}
                {% endblock content %}
            </div>
        </div>
        <script>
            btns = document.querySelectorAll('button.opener')
            for (btn of btns){
                btn.addEventListener("click", function (){
                    panel = document.querySelector('#' + CSS.escape(`panel-${this.id}`))
                    if (panel.style.display === "block") {
                        document.querySelector('button#' + CSS.escape(`${this.id}`)).innerHTML = 'Show sets'
                        panel.style.display = "none"
                    } else {
                        document.querySelector('button#' + CSS.escape(`${this.id}`)).innerHTML = 'Hide sets'
                        panel.style.display = "block"
                    }
                })
            }
            checks = document.querySelectorAll('input[type=checkbox].meta')
            dict = {}
            for (check of checks){
                check.addEventListener("change", function (){
                    panel = document.querySelectorAll('#' + CSS.escape(`panel-${this.id}`) + ' input')
                    for (set of panel) set.checked = this.checked
                    if (this.checked) dict[this.id] = panel.length
                    else dict[this.id] = 0
                })
            }
            generate = async () => {
                checkedBoxes = document.querySelectorAll('input[name="sets"]:checked')
                if (checkedBoxes.length > 0){
                    values = Array.from(checkedBoxes).map(cb => cb.value)
                    data = {included: values}
                    response = await fetch('/generate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)})
                    document.querySelector('#pin-box').value = await response.json()
                }
            }
            start = () => {
                pin = document.querySelector('#pin-box').value
                window.location.href = `/mainloop/${pin}/0`
            }
            change = (element) => {
                id = element.id
                id = id.substring(0, id.lastIndexOf('-'))
                if (dict[id] == undefined) dict[id] = 0
                if (element.checked) dict[id] ++;
                else dict[id] --;
                parent = document.querySelector('#' + CSS.escape(`${id}`))
                panel = document.querySelectorAll('#' + CSS.escape(`panel-${id}`) + ' input')
                if (dict[id] == 0) parent.checked = false
                else if (dict[id] == panel.length){
                    parent.indeterminate = false
                    parent.checked = true
                }
                else parent.indeterminate = true
            }
        </script>
    </body>
</html>
